<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDF PLATEAU 東京駅</title>
    <meta name="description" content="PLATEAU の 3D 都市モデル（LOD2）を WebGPU 上で SDF に焼き込み、レイマーチで描画して MapLibre の地図に重ねる Web アプリケーション。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sdf-plateau.kanakanho.workers.dev/" />
    <meta property="og:title" content="SDF PLATEAU 東京駅" />
    <meta property="og:description" content="PLATEAU の 3D 都市モデル（LOD2）を WebGPU 上で SDF に焼き込み、レイマーチで描画して MapLibre の地図に重ねる Web アプリケーション。" />
    <meta property="og:image" content="https://sdf-plateau.kanakanho.workers.dev/ogp.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="map"></div>
    <button id="panel-show" type="button" title="パネルを表示" aria-label="パネルを表示">☰</button>
    <aside id="panel">
      <header>
        <h1>SDF PLATEAU <small>東京駅周辺</small></h1>
        <button id="panel-hide" type="button" title="パネルを隠す" aria-label="パネルを隠す">×</button>
      </header>
      <label>描画
        <select id="mode">
          <option value="sdf">SDF レイマーチ</option>
          <option value="raster">ラスタ（比較用）</option>
        </select>
      </label>
      <label>色分け
        <select id="color">
          <option value="0">面の種類</option>
          <option value="1">高さ</option>
          <option value="2">用途</option>
          <option value="3">建築年</option>
          <option value="4">ステップ数（デバッグ）</option>
        </select>
      </label>
      <label>日付 <input id="date" type="date" /></label>
      <label class="row">時刻 <input id="time" type="range" min="0" max="1439" step="1" /> <span id="time-label"></span>
        <button id="play" type="button">▶</button></label>
      <fieldset>
        <label class="check"><input id="shadows" type="checkbox" /> 影（ソフトシャドウ）</label>
        <label class="check"><input id="groundShadows" type="checkbox" /> 地面の影</label>
        <label class="check"><input id="ao" type="checkbox" /> アンビエントオクルージョン</label>
        <label class="check"><input id="refine" type="checkbox" /> 交点を三角形で補正</label>
        <label class="check"><input id="picking" type="checkbox" /> クリックで建物を選択</label>
      </fieldset>
      <label class="row">解像度 <input id="scale" type="range" min="0.25" max="1" step="0.05" /> <span id="scale-label"></span></label>
      <label>背景地図
        <select id="base">
          <option value="pale">淡色地図</option>
          <option value="std">標準地図</option>
          <option value="photo">航空写真</option>
          <option value="white">白（地図なし）</option>
        </select>
      </label>
      <p id="fps"></p>
      <p id="status"></p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
